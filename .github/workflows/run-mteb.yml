name: run-mteb

on:
  push:
    branches:
      - mteb-multilingual-v2
    paths:
      - .github/workflows/run-mteb.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-mteb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-results:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: ${{ github.workspace }}/data/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-mteb.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -r requirements-mteb.txt
          python -m pip install -e . --no-deps
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run MTEB Multilingual v2 tokenizer audit
        run: |
          xlmr-token-overlap all-mteb \
            --source-dir data \
            --output-dir results/mteb \
            --flores-dir results/flores \
            --family-token-budget 20000 \
            --overall-token-budget 30000 \
            --seed 1729
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- results/mteb
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add MTEB Multilingual v2 overlap results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
